services:
  postgres:
    image: postgis/postgis:15-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sosedi}
      POSTGRES_USER: ${POSTGRES_USER:-sosedi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sosedi}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
