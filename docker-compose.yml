services:
  postgres:
    image: postgis/postgis:15-3.5@sha256:54f7933d972e107fda9b696745c21e3fcc643c4263b43f7dc43ba4bdb312fc2c
    # The official PostGIS image does not publish an arm64 manifest.
    # Docker Desktop runs this service through its Apple Silicon amd64 emulator.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sosedi}
      POSTGRES_USER: ${POSTGRES_USER:-sosedi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sosedi}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4.9-bookworm@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
