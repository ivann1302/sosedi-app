# Development only: isolated from production and exposed on loopback.
services:
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run make local-storage-up}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run make local-storage-up}
    ports:
      - '127.0.0.1:9030:9000'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  storage-data:
