[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies and build output are not project source"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.dart_tool/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)ios/Pods/''',
]

[[allowlists]]
description = "Public RFC 6238 SHA-1 test vector, not a credential"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^backend/src/admin/admin-totp\.spec\.ts$''']
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']
