name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Cache generated Prisma client
        id: prisma-client-cache
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: ${{ runner.os }}-node22-prisma-${{ hashFiles('backend/package-lock.json', 'backend/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.prisma-client-cache.outputs.cache-hit != 'true'
        run: npx prisma generate
        working-directory: backend

      - name: Lint
        run: make backend-lint-check

      - name: Unit tests with coverage
        run: make backend-test-coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

      - name: E2E tests with PostgreSQL/PostGIS and Redis
        run: make backend-test-e2e

      - name: Stop test infrastructure
        if: always()
        run: make test-infra-down

      - name: Build
        run: make backend-build

      - name: Build production backend image
        env:
          BACKEND_RELEASE: ci-${{ github.sha }}
          BACKEND_IMAGE_TAG: sosedi-backend:ci
        run: make backend-image-build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true
          pub-cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-3.44.7-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: mobile

      - name: Analyze
        run: make mobile-analyze

      - name: Test with coverage
        run: make mobile-test-coverage

      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: warn

  ios-smoke:
    name: iOS no-codesign smoke
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true
          pub-cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-3.44.7-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}

      - name: Build locked graph without signing
        run: make mobile-ios-smoke

  operator:
    name: Operator web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: operator/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: operator

      - name: Type-check and build
        run: make operator-build

  public-web:
    name: Public legal/support web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: public-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: public-web

      - name: Type-check, lint, build and smoke
        run: make public-web-check
